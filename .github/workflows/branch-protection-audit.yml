# Maintainer-only: verify remote branch protection matches devtools/branch-protection.json,
# and update an in-repo evidence artifact that is enforced as a merge gate.
name: branch-protection-audit

on:
  schedule:
    - cron: "23 3 * * 1" # weekly (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify remote branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/verify-branch-protection-remote.sh

      - name: Capture branch protection summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/print-branch-protection-summary.sh main > /tmp/branch_protection_summary.txt

      - name: Update evidence artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          
          summary_txt = Path("/tmp/branch_protection_summary.txt").read_text(encoding="utf-8").splitlines()
          evidence = {
              "verified": True,
              "last_verified_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "summary": summary_txt,
          }
          out = Path("docs/operations/branch-protection-evidence.json")
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Wrote {out}")
          PY

      - name: Open PR updating evidence
        uses: peter-evans/create-pull-request@4320041ed380b20e97d388d56a7fb4f9b8c20e79 # v7.0.0
        with:
          commit-message: "chore(governance): refresh branch protection evidence"
          title: "chore(governance): refresh branch protection evidence"
          body: |
            Automated update of `docs/operations/branch-protection-evidence.json` from the scheduled branch-protection audit.
            
            This keeps the merge gate `branch-protection-evidence / check` satisfied with fresh, verified evidence.
          branch: "automation/branch-protection-evidence"
          delete-branch: true
          add-paths: |
            docs/operations/branch-protection-evidence.json
