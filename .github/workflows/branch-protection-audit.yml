# Maintainer-only: verify remote branch protection matches devtools/branch-protection.json.
# Read-only on the repo: logs a human-readable summary; no commits or PRs.
name: branch-protection-audit

on:
  schedule:
    - cron: "23 3 1 * *" # monthly 03:23 UTC on the 1st
  workflow_dispatch:

# Review 2026-12-31: remove when GitHub Actions defaults to Node 24 for JS actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ravenoak/oh-my-stigmergy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Require BP_ADMIN_TOKEN repository secret
        env:
          BP_ADMIN_TOKEN: ${{ secrets.BP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BP_ADMIN_TOKEN}" ]; then
            echo "::error::BP_ADMIN_TOKEN is required on ravenoak/oh-my-stigmergy for branch-protection-audit (admin-capable token for gh api)." >&2
            exit 1
          fi

      - name: Verify remote branch protection
        env:
          GH_TOKEN: ${{ secrets.BP_ADMIN_TOKEN }}
        run: bash scripts/verify-branch-protection-remote.sh

      - name: Log branch protection summary
        env:
          GH_TOKEN: ${{ secrets.BP_ADMIN_TOKEN }}
        run: bash scripts/print-branch-protection-summary.sh main
