# FR-0.2: deterministic spec validation on every push/PR (see docs/requirements/FR.md).
# Cost model: governance job always runs; specs-and-packages skips on doc-only PRs.
# Required branch protection check name stays: allium-specs / check
name: allium-specs

# Review 2026-12-31: remove when GitHub Actions defaults to Node 24 for JS actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: allium-specs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.out.outputs.relevant }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: out
        name: Decide if heavy CI is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${BASE_REF}" --quiet || true
          remote_ref="origin/${BASE_REF}"
          if ! git rev-parse --verify "${remote_ref}" >/dev/null 2>&1; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "${remote_ref}...HEAD" || true)"
          if [ -z "${files}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          is_heavy() {
            case "$1" in
              spec/*|packages/*|scripts/*|tests/*|devtools/*|docs/requirements/*|docs/traceability/*|docs/adr/*|docs/operations/*|docs/guides/*|docs/CONSTITUTION.md|docs/PRD.md|.github/workflows/*|.python-version)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          is_light_only() {
            case "$1" in
              docs/*)
                case "$1" in
                  docs/requirements/*|docs/traceability/*|docs/adr/*|docs/operations/*|docs/guides/*|docs/CONSTITUTION.md|docs/PRD.md)
                    return 1
                    ;;
                  *)
                    return 0
                    ;;
                esac
                ;;
              *.md)
                case "$1" in
                  */*)
                    return 1
                    ;;
                  *)
                    return 0
                    ;;
                esac
                ;;
              *)
                return 1
                ;;
            esac
          }
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            if is_heavy "${f}"; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "${files}"
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            if ! is_light_only "${f}"; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "${files}"
          echo "relevant=false" >> "$GITHUB_OUTPUT"

  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: CI contract (merge gate wiring)
        run: bash tests/ci_contract.sh

      - name: Actions SHA pinning (workflows)
        run: bash scripts/verify-actions-pinned.sh

      - name: CI job wall-clock bounds (NFR-P2)
        run: bash scripts/verify-job-timeouts.sh

      - name: CI heavy-job budget (NFR-P1)
        run: bash scripts/verify-heavy-budget.sh

      - name: Secret pattern scan on PR diff (NFR-S2)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify-no-secrets.sh

      - name: OpenCode plugin manifest contract (FR-5.1 / Phase 11)
        run: bash scripts/verify-opencode-plugin-contract.sh

      - name: Requirement ID traceability
        run: bash scripts/verify-requirement-traceability.sh

      - name: Governance doc co-touch (FR-0.1)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify-governance-doc-cotouch.sh

      - name: Constitution amendment co-touch (FR-0.1)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify-constitution-amendment-cotouch.sh

      - name: FR spec anchor paths (FR-0.1)
        run: bash scripts/verify-fr-spec-anchors.sh

      - name: Distillation contract (FR-1.2)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify-distillation-contract.sh

      - name: Crucible shim policy attestation (FR-4.1 / NFR-S1)
        run: bash scripts/verify-shim-policy.sh

      - name: Crucible shim policy diff co-touch (FR-4.1)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/verify-shim-policy-diff.sh

  specs-and-packages:
    needs: filter
    if: needs.filter.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Sync Python workspace (locked)
        run: uv sync --frozen --all-extras --all-groups

      - name: Cache Cargo and allium-cli install
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-allium-${{ runner.os }}-${{ hashFiles('devtools/allium-cli.version') }}
          restore-keys: |
            cargo-allium-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (pinned)
        with:
          toolchain: stable

      - name: Install allium CLI
        run: |
          set -euo pipefail
          VERSION=$(tr -d ' \n' < devtools/allium-cli.version)
          if command -v allium >/dev/null 2>&1; then
            if allium --version 2>&1 | grep -qF "${VERSION}"; then
              echo "allium ${VERSION} already on PATH"
              exit 0
            fi
          fi
          cargo install allium-cli --version "${VERSION}"

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Allium check (structural)
        run: bash scripts/check-allium-specs.sh

      - name: Allium analyse (process-level)
        run: bash scripts/analyse-allium-specs.sh

      - name: Crucible compile golden diff (FR-4.2)
        run: bash scripts/verify-crucible-compile.sh

      - name: Graph package unit tests (FR-2.x)
        timeout-minutes: 2
        run: uv run python -m unittest discover -s packages/graph/tests -p 'test_*.py' -v

      - name: Crucible compiler unit tests
        run: uv run python -m unittest discover -s packages/crucible/tests -p 'test_*.py' -v

      - name: Transitions harness (FR-1.3)
        run: |
          command -v allium
          uv run python -m unittest discover -s packages/transitions/tests -p 'test_*.py' -v

      - name: Stance package unit tests (FR-1.4)
        run: uv run python -m unittest discover -s packages/stance/tests -p 'test_*.py' -v

      - name: SBP server tests (FR-3.x; stream.test.mjs rotation.test.mjs compaction.test.mjs decay-gc.test.mjs sqlite-store.test.mjs healthz.test.mjs multi-writer.test.mjs stance-registry.test.mjs)
        run: cd packages/sbp-server && npm ci && npm test

      - name: OpenCode plugin tests (FR-5.x; plugin.test.mjs events.test.mjs tools-schema.test.mjs)
        run: cd packages/opencode-plugin && npm ci && npm test

      - name: Install Z3 (golden SMT)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq z3

      - name: Golden SMT verification (FR-4.3)
        run: bash scripts/verify-smt-golden.sh

      - name: Crucible solve spec/ (FR-4.3)
        run: uv run python -m crucible.cli solve "${{ github.workspace }}/spec"

      - name: Crucible shim contract (FR-4.1 / NFR-S1)
        run: bash tests/crucible_shim_contract.sh

  check:
    if: always()
    needs: [filter, governance, specs-and-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate merge gate
        env:
          GOV: ${{ needs.governance.result }}
          HEAVY: ${{ needs.specs-and-packages.result }}
        run: |
          set -euo pipefail
          echo "governance=${GOV} specs-and-packages=${HEAVY}"
          [ "${GOV}" = "success" ] || {
            echo "governance job did not succeed (${GOV})" >&2
            exit 1
          }
          case "${HEAVY}" in
            success|skipped) ;;
            *)
              echo "specs-and-packages job did not succeed or skip (${HEAVY})" >&2
              exit 1
              ;;
          esac
          echo "allium-specs merge gate: ok"
