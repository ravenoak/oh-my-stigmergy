# Merge gate: branch protection evidence must be verified and fresh.
name: branch-protection-evidence

# Review 2026-12-31: remove when GitHub Actions defaults to Node 24 for JS actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: branch-protection-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify branch protection evidence freshness
        env:
          MAX_AGE_DAYS: "30"
        run: bash scripts/verify-branch-protection-evidence-fresh.sh

