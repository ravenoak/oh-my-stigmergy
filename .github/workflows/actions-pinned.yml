# Enforce that all GitHub Actions workflows are pinned to immutable SHAs.
name: actions-pinned

# Review 2026-12-31: remove when GitHub Actions defaults to Node 24 for JS actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: actions-pinned-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify workflows are SHA-pinned
        run: bash scripts/verify-actions-pinned.sh

