# OSS-only security gates for agentic development.
name: security

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@bf2dc8e55639c1e091e9b45970152e4313705814 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version-file: devtools/uv.version
          enable-cache: true

      - name: Sync Python workspace (locked)
        run: uv sync --frozen --all-extras --all-groups

      - name: Python dependency vulnerability audit (pip-audit)
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --all-groups --no-hashes --no-editable --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

      - name: Static analysis (Semgrep OSS)
        run: |
          set -euo pipefail
          uvx semgrep --config p/ci --error --metrics=off

      - name: Node dependency vulnerability audit (npm audit)
        run: |
          set -euo pipefail
          cd packages/sbp-server
          npm ci
          npm audit --audit-level=high

