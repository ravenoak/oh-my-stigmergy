# OSS-only security gates for agentic development.
name: security

# Review 2026-12-31: remove when GitHub Actions defaults to Node 24 for JS actions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e87a89192a7a58b06bdedf25ad4196f89a45d76d # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Sync Python workspace (locked)
        run: uv sync --frozen --all-extras --all-groups

      - name: Python dependency vulnerability audit (pip-audit)
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --all-groups --no-hashes --no-editable --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

      - name: Static analysis (Semgrep OSS)
        run: |
          set -euo pipefail
          uvx semgrep --config p/ci --error --metrics=off

      - name: Node dependency vulnerability audit (npm audit)
        run: |
          set -euo pipefail
          cd packages/sbp-server
          npm ci
          npm audit --audit-level=high

