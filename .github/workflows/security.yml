# OSS-only security gates for agentic development.
name: security

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@bf2dc8e55639c1e091e9b45970152e4313705814 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Sync Python workspace (locked)
        run: uv sync --frozen --all-extras --all-groups

      - name: Python dependency vulnerability audit (pip-audit)
        run: |
          set -euo pipefail
          uv export --frozen --all-extras --all-groups --no-hashes --no-editable --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

      - name: Static analysis (Semgrep OSS)
        run: |
          set -euo pipefail
          uvx semgrep --config p/ci --error --metrics=off

      - name: Node dependency vulnerability audit (npm audit)
        run: |
          set -euo pipefail
          cd packages/sbp-server
          npm ci
          npm audit --audit-level=high

