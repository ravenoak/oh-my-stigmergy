version: 2
updates:
  # Keep GitHub Actions pinned SHAs current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Root Python workspace (uv / pyproject / uv.lock).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # SBP server Node dependencies.
  - package-ecosystem: "npm"
    directory: "/packages/sbp-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

