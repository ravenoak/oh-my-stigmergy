[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-stigmergy-graph"
version = "0.1.0"
description = "Relation-first code cards and load_node (FR-2.x)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter-languages>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
