[project]
name = "oh-my-stigmergy-stance"
version = "0.1.0"
description = "Normative agent stance configuration schema + validator (FR-1.4)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
